services:
  postgres:
    image: postgres:16-alpine
    container_name: waypoint_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waypoint_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db/03-views.sql:/docker-entrypoint-initdb.d/03-views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waypoint_user} -d ${POSTGRES_DB:-waypoint_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
